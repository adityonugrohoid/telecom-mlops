name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      # One use case at a time, with OpenMP on the runner's cores: parallel runs
      # oversubscribe the threads of xgboost and lightgbm.
      - name: Set thread count
        run: echo "OMP_NUM_THREADS=$(nproc)" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy packages/*/src

      - name: Tests
        run: uv run pytest -q

      - name: Notebooks are stored without outputs
        run: uv run nbstripout --verify packages/*/notebooks/*.ipynb

      - name: Notebooks run
        run: uv run pytest -q --nbmake packages/*/notebooks/*.ipynb

      # Simulated data only. A stateless replay of 14 simulated days for all six use
      # cases, from an empty state folder that is thrown away with the runner.
      - name: Replay 14 simulated days
        run: uv run tml loop all --from 2026-01-01 --days 14 --state "$RUNNER_TEMP/state"
