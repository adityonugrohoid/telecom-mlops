[project]
name = "telecom-mlops"
version = "0.1.0"
description = "Six telecom ML use cases on one MLOps pipeline with a simulated daily drift loop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["telecom-ml-core"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/core/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
