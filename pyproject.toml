[project]
name = "telecom-mlops"
version = "0.1.0"
description = "Six telecom ML use cases on one MLOps pipeline with a simulated daily drift loop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["telecom-ml-core", "telecom-ml-churn", "telecom-ml-root-cause", "telecom-ml-anomaly", "telecom-ml-qoe"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
telecom-ml-core = { workspace = true }
telecom-ml-churn = { workspace = true }
telecom-ml-root-cause = { workspace = true }
telecom-ml-anomaly = { workspace = true }
telecom-ml-qoe = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "matplotlib>=3.9",
    "mypy>=1.13",
    "nbmake>=1.5",
    "nbstripout>=0.8",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
    "scipy>=1.14",
    "shap>=0.52",
    "time-machine>=2.16",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/core/tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
