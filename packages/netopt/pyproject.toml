[project]
name = "telecom-ml-netopt"
version = "0.1.0"
description = "Netopt use case: stylised cell-optimisation simulator, tabular Q-learning policy and rule-based baseline"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telecom-ml-core",
]

[project.entry-points."telecom_ml.usecases"]
netopt = "telecom_ml_netopt.usecase:NetOptUseCase"

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_netopt"]
