[project]
name = "telecom-ml-root-cause"
version = "0.1.0"
description = "Root-cause use case: dated alarm cascade generator, drift calendar, XGBoost ranker and first-alarm baseline"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telecom-ml-core",
    "scikit-learn>=1.9",
    "xgboost>=3.2",
]

[project.entry-points."telecom_ml.usecases"]
root-cause = "telecom_ml_root_cause.usecase:RootCauseUseCase"

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_root_cause"]
