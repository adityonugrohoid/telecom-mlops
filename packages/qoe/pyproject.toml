[project]
name = "telecom-ml-qoe"
version = "0.1.0"
description = "QoE use case: dated session generator, drift calendar, LightGBM MOS regressor and mean baseline"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telecom-ml-core",
    "lightgbm>=4.7",
    "scikit-learn>=1.9",
]

[project.entry-points."telecom_ml.usecases"]
qoe = "telecom_ml_qoe.usecase:QoEUseCase"

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_qoe"]
