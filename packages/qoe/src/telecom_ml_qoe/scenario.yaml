# QoE drift calendar (docs/generators.md). Parameter names match generator.BASE_PARAMS;
# each value is where the parameter ends once the event has ramped in.
start: 2026-01-01
days: 180
base_seed: 42
events:
  - name: high_end_device_growth
    day: 40
    ramp_days: 30
    kind: covariate
    params: {high_device_share: 0.5}
    benign: true
  - name: video_codec_change
    day: 90
    ramp_days: 0
    kind: concept
    params: {video_codec_gain: 3.0}
    benign: false
  - name: cloud_gaming_launch
    day: 150
    ramp_days: 0
    kind: new_class
    params: {cloud_gaming_share: 0.1}
    benign: false
