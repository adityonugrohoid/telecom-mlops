[project]
name = "telecom-ml-anomaly"
version = "0.1.0"
description = "Anomaly use case: dated cell-hour KPI generator, drift calendar, Isolation Forest detector"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telecom-ml-core",
    "scikit-learn>=1.9",
]

[project.entry-points."telecom_ml.usecases"]
anomaly = "telecom_ml_anomaly.usecase:AnomalyUseCase"

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_anomaly"]
