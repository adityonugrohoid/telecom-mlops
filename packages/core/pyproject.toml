[project]
name = "telecom-ml-core"
version = "0.1.0"
description = "The shared pipeline and tooling: contract, runner, validate, drift, evaluate, registry, report, CLI"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "evidently>=0.7",
    "mlflow>=3.0",
    "numpy>=2.1",
    "pandas>=3.0",
    "pandera>=0.22",
    "pyyaml>=6.0",
]

[project.scripts]
tml = "telecom_ml_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_core"]
