[project]
name = "telecom-ml-churn"
version = "0.1.0"
description = "Churn use case: dated generator, drift calendar, XGBoost model and logistic baseline"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "telecom-ml-core",
    "scikit-learn>=1.9",
    "xgboost>=3.2",
]

[project.entry-points."telecom_ml.usecases"]
churn = "telecom_ml_churn.usecase:ChurnUseCase"

[tool.uv.sources]
telecom-ml-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_ml_churn"]
